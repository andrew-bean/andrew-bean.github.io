  <!-- ============================================================ -->
  <!-- INCREMENTAL PoS ADJUSTMENT ARROW (right side, vertical)     -->
    <!-- Body spans y=62–374.4; triangle arrowhead points down       -->
  <!-- ============================================================ -->
  <!-- Gradient body -->
    <rect x="907" y="62" width="52" height="312.4" fill="url(#incGrad)"/>
  <!-- Downward-pointing triangle arrowhead -->
    <polygon points="907,374 959,374 933,400" fill="#ff4e00"/>

  <!-- Label: rotate(90) = reads top-to-bottom, bottom of letters on left -->
    <!-- Arrow body centre: x=933, y=(62+374.4)/2=218.2 -->
  <text font-family="'Volta Modern Display','Segoe UI',Arial,sans-serif"
                        font-weight="600" font-size="16.9" fill="#161616"
        text-anchor="middle" dominant-baseline="middle"
                        transform="rotate(90, 933, 218.2)">
            <tspan x="933" y="207.7">Incremental</tspan>
            <tspan x="933" dy="21">PoS adjustment</tspan>
  </text>

