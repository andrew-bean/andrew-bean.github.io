<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual representation of PoS results</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 5px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        
        #container {
            max-width: 870px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        
        #controls {
            display: none; /* Hide controls to save space */
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 6px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-weight: 500;
            color: #555;
            font-size: 13px;
        }
        
        input[type="number"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        #buttonPanel {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        #step-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        
        /* Matches the hurdle-diagram explainer's .pv-hd-btn controls */
        #next-btn,
        #reset-btn {
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 6px;
            padding: 4px 8px;
            font: inherit;
            font-size: 13px;
            color: #4B5563;
            line-height: 1;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        
        #next-btn:hover:not(:disabled),
        #reset-btn:hover:not(:disabled) {
            background: #F1F3F5;
            color: #1A1A1A;
        }
        
        #next-btn:disabled,
        #reset-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        
        #step-counter {
            margin-left: 6px;
            font-size: 11px;
            color: #6B7075;
            font-variant-numeric: tabular-nums;
        }
        
        #visualization {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            padding: 10px;
            overflow: hidden;
        }
        
        svg {
            max-width: 100%;
            height: auto;
        }
        
        .program-rect {
            fill: #ACACAC;
            stroke: none;
        }
        
        .trial-circle {
            fill: #a5bff5;
            stroke: #161616;
            stroke-width: 1;
        }
        
        .endpoint-square {
            fill: #d38cc9;
            stroke: none;
        }
        
        .endpoint-triangle {
            fill: #a5bff5;
            stroke: none;
        }
        
        .ci-line {
            stroke: #484848;
            stroke-width: 2;
        }
        
        .axis-line {
            stroke: #ACACAC;
            stroke-width: 1;
        }
        
        .axis-text {
            font-size: 12px;
            fill: #484848;
        }
        
        .tpp-box {
            fill: none;
            stroke: #ff4e00;
            stroke-width: 2;
            stroke-dasharray: 4;
        }
        
        .reference-line {
            stroke: #ACACAC;
            stroke-width: 1;
            stroke-dasharray: 2;
        }
        
        #step-explanation {
            order: 2;
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
            padding: 12px 16px;
            background: #F5F5F5;
            border-left: 4px solid #ff4e00;
            border-radius: 4px;
            text-align: left;
        }
        
        .outcome-summary {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
        }
        
    </style>
</head>
<body>
    <div id="container">
        <span id="info-text" style="display:none;"></span>
        
        <div id="controls">
            <div class="control-group">
                <label for="n-programs">Number of simulated programs:</label>
                <input type="number" id="n-programs" value="20" min="10" max="100", step="10">
            </div>
            
            <div class="control-group">
                <label for="n-trials">Trials/Program:</label>
                <input type="number" id="n-trials" value="2" min="1" max="3">
            </div>
            
            <div class="control-group">
                <label for="n-endpoints">Endpoints/Trial:</label>
                <input type="number" id="n-endpoints" value="2" min="1" max="2">
            </div>
            
            <div class="control-group">
                <label for="global-mean">Global Mean treatment effect:</label>
                <input type="number" id="global-mean" value="2" step="0.1">
            </div>
            
            <div class="control-group">
                <label for="program-sd">SD Across Programs:</label>
                <input type="number" id="program-sd" value="1" step="0.1" min="0.01">
            </div>
            
            <div class="control-group">
                <label for="study-sd">Trial Standard Error:</label>
                <input type="number" id="study-sd" value="0.5" step="0.1" min="0.01">
            </div>
            
            <div class="control-group">
                <label for="program-corr">Correlation of program means:</label>
                <input type="number" id="program-corr" value="0.7" step="0.1" min="-1" max="1">
            </div>
            
            <div class="control-group">
                <label for="study-corr">Correlation of study outcomes:</label>
                <input type="number" id="study-corr" value="0.3" step="0.1" min="-1" max="1">
            </div>
            
            <div class="control-group">
                <label for="tpp-primary">TPP Primary:</label>
                <input type="number" id="tpp-primary" value="1.5" step="0.1" min="0">
            </div>
            
            <div class="control-group">
                <label for="tpp-secondary">TPP Secondary:</label>
                <input type="number" id="tpp-secondary" value="1.5" step="0.1" min="0">
            </div>
            
            <div class="control-group">
                <label for="safety-failure-rate">Safety Failure:</label>
                <input type="number" id="safety-failure-rate" value="0.1" step="0.05" min="0" max="1">
            </div>
            
            <div class="control-group">
                <label for="regulatory-failure-rate">Regulatory Failure:</label>
                <input type="number" id="regulatory-failure-rate" value="0.1" step="0.05" min="0" max="1">
            </div>
        </div>
        
        <div id="buttonPanel">
            <div id="step-nav">
                <button id="reset-btn">&#8634; Reset</button>
                <span id="step-counter"></span>
                <button id="next-btn" disabled>Next &#8250;</button>
            </div>
        </div>
        
        <div id="visualization">
            <div id="step-explanation" style="display: none;">
                <span id="explanation-text"></span>
            </div>
        </div>
    </div>

    <!-- Load as ES6 module -->
    <script type="module" src="main.js"></script>
</body>
</html>
