<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How efficacy predictions are formed in Smart PoS</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 0;
            background: transparent;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            padding: 12px 18px 10px;
            background: white;
        }

        h1 {
            text-align: center;
            color: #161616;
            margin-bottom: 8px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .main-layout {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .sidebar {
            min-width: 250px;
            max-width: 250px;
            flex-shrink: 0;
        }

        .chart-area {
            width: 460px;
            max-width: 460px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            flex: 0 0 auto;
        }

        .panel h2 {
            font-size: 13px;
            color: #161616;
            margin-bottom: 4px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .chart-container {
            height: 260px;
        }

        .chart-container svg {
            width: 100%;
            height: 100%;
        }

        .controls-sidebar {
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .control-section { margin-bottom: 10px; }
        .control-section:last-child { margin-bottom: 0; }

        .control-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: #161616;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 2px solid #ff4e00;
        }

        .control-group { margin-bottom: 8px; }

        .control-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 3px;
            font-weight: 500;
        }

        .value-display {
            display: inline-block;
            float: right;
            color: #ff4e00;
            font-weight: 600;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #dadada;
            outline: none;
            -webkit-appearance: none;
            accent-color: #ff4e00;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #ff4e00;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #ff4e00;
            cursor: pointer;
            border: none;
        }

        .control-group input[type="number"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .fixed-note {
            font-size: 12px;
            color: #666;
            background: #f5f5f5;
            border-radius: 4px;
            padding: 6px 8px;
            line-height: 1.35;
        }

        .fixed-note strong { color: #161616; }

        .axis { font-size: 11px; }
        .axis path, .axis line { stroke: #999; }
        .grid line { stroke: #e0e0e0; stroke-dasharray: 2,2; }
        .grid path { stroke-width: 0; }
        .density-line { fill: none; stroke-width: 2.5; }
        .density-area { opacity: 0.25; }

        .threshold-line { stroke-width: 2; stroke-dasharray: 5,5; }

        .info-box {
            margin-top: 6px;
            padding: 6px 8px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
            color: #161616;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button { cursor: pointer; transition: background-color 0.2s ease; }
        button:hover:not(:disabled):not(.calibrated) { background-color: #e04500 !important; }
        button.calibrated:hover { background-color: #888888 !important; cursor: default !important; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .legend { font-size: 12px; text-align: center; flex-shrink: 0; margin-top: 4px; }
        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-right: 16px;
        }
        .legend-item:last-child { margin-right: 0; }
        .legend-swatch {
            display: inline-block;
            width: 18px;
            height: 3px;
            border-radius: 1px;
            background: currentColor;
            flex-shrink: 0;
        }

        .predictive-row {
            position: relative;
        }
        .predictive-stats {
            position: absolute;
            top: 10px;
            left: 66px;
            width: auto;
            background: #fff;
            border-radius: 4px;
            padding: 4px 8px;
            box-shadow: 0 1px 4px rgba(22, 22, 22, 0.18);
            pointer-events: none;
        }
        .predictive-stats table {
            width: auto;
            border-collapse: collapse;
            font-size: 12px;
            background: transparent;
        }
        .predictive-stats th,
        .predictive-stats td {
            padding: 3px 8px 3px 3px;
            text-align: left;
        }
        .predictive-stats thead th {
            border-bottom: 2px solid rgba(22, 22, 22, 0.25);
            font-weight: 600;
            color: #161616;
        }
        .predictive-stats tbody tr:not(:last-child) td {
            border-bottom: 1px solid rgba(22, 22, 22, 0.12);
        }
        .predictive-stats td.stat-value {
            text-align: right;
            font-weight: 700;
            color: #ff4e00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-layout">
            <!-- Sidebar with all controls -->
            <div class="sidebar">
                <div class="controls-sidebar">
                    <!-- Prior Properties & Calibration -->
                    <div class="control-section">
                        <h3>Prior Distribution</h3>
                        <div class="control-group">
                            <label style="margin-bottom: 6px;">
                                Treatment effect used to power a standard trial
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                                <input type="checkbox" id="mu2-align-tpp" checked style="width: auto; margin: 0;" />
                                <span style="font-size: 12px;">Aligned with TPP (<strong id="mu2-aligned-value">2.00</strong>)</span>
                            </label>
                            <div id="mu2-manual-controls" style="display: none;">
                                <label style="margin-top: 6px;">
                                    <span class="value-display" id="mu2-value">2.00</span>
                                </label>
                                <input type="range" id="mu2" min="0.25" max="5" step="0.1" value="2">
                            </div>
                        </div>

                        <!-- Weight Calibration -->
                        <div class="control-group" style="margin-top: 10px;">
                            <label>
                                Benchmark before the Phase-2 study
                                <span class="value-display" id="benchmark-prob-value">15.0%</span>
                            </label>
                            <input type="range" id="benchmark-prob" min="0.01" max="0.50" step="0.01" value="0.15">
                        </div>

                        <div class="control-group" style="margin-top: 10px;">
                            <button id="calibrate-btn" style="width: 100%; padding: 8px; background: #ff4e00; color: white; border: none; border-radius: 4px; font-size: 13px; font-weight: 600;">
                                Calibrate Prior to Benchmark
                            </button>
                        </div>
                        <div class="info-box" id="calibration-info">
                            <span id="calibration-status-badge" style="font-size: 16px;">&#x274C;</span>
                            <span id="calibration-status-text">Not calibrated</span>
                        </div>
                    </div>

                    <!-- Phase 2 Study Design -->
                    <div class="control-section">
                        <h3>Phase 2 Outcome</h3>
                        <div class="control-group">
                            <label>
                                Observed Mean Difference
                                <span class="value-display" id="obs-mean-value">2.20</span>
                            </label>
                            <input type="range" id="obs-mean" min="-2" max="8" step="0.1" value="2.2">
                        </div>
                        <div class="control-group">
                            <label>
                                Sample Size (per arm)
                                <span class="value-display" id="n2-value">100</span>
                            </label>
                            <input type="range" id="n2" min="10" max="200" step="10" value="100">
                        </div>
                    </div>

                    <!-- Phase 3 Study Design -->
                    <div class="control-section">
                        <h3>Phase 3 Study Design</h3>
                        <div class="control-group">
                            <label>
                                Sample Size (per arm)
                                <span class="value-display" id="n3-value">300</span>
                            </label>
                            <input type="range" id="n3" min="50" max="1000" step="50" value="300">
                        </div>
                    </div>

                    <!-- Success Criteria -->
                    <div class="control-section">
                        <h3>Success Criteria</h3>
                        <div class="control-group">
                            <label>
                                TPP
                                <span class="value-display" id="eff-threshold-value">2.00</span>
                            </label>
                            <input type="range" id="eff-threshold" min="0" max="5" step="0.1" value="2">
                        </div>
                        <div class="fixed-note">
                            Significance level fixed at one-sided <strong>&alpha; = 0.025</strong>, matching the standard Phase-3 pivotal design.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart panels -->
            <div class="chart-area">
                <div class="panel">
                    <h2>Belief updating: prior &rarr; likelihood &rarr; posterior</h2>
                    <div class="chart-container">
                        <svg id="chart-belief" class="chart"></svg>
                    </div>
                    <div class="legend" id="belief-legend"></div>
                </div>

                <div class="panel">
                    <h2>Predictive distribution for Phase-3 estimated effect</h2>
                    <div class="predictive-row">
                        <div class="chart-container">
                            <svg id="chart-predictive" class="chart"></svg>
                        </div>
                        <div class="predictive-stats" id="predictive-stats"></div>
                    </div>
                    <div class="legend" id="predictive-legend"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load as ES6 module -->
    <script type="module" src="main.js"></script>
</body>
</html>
